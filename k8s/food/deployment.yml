apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-service
  namespace: food-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-service
  template:
    metadata:
      labels:
        app: food-service
    spec:
      containers:
        - name: food-service
          image: food-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: food-delivery-config
            - secretRef:
                name: food-delivery-secrets
          env:
            - name: DB_URL
              value: "postgres://postgres:postgres@host.docker.internal:5432/food-service-db?sslmode=disable"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
